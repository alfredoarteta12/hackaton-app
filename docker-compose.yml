services:
  api:
    build:
      context: ./plancity-api
    ports:
      - "3001:3001"
    env_file:
      - ./plancity-api/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./plancity-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
