services:

  api:
    build:
      context: ./plancity-api-main
      dockerfile: Dockerfile
    container_name: plancity-api
    ports:
      - "3001:3001"
    env_file:
      - ./plancity-api-main/.env
    networks:
      - plancity-net
    restart: unless-stopped

  frontend:
    build:
      context: ./plancity-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: plancity-frontend
    ports:
      - "80:80"
    networks:
      - plancity-net
    depends_on:
      - api
    restart: unless-stopped

networks:
  plancity-net:
    driver: bridge
